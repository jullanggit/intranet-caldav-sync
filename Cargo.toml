[package]
name = "tam-scraper"
version = "0.1.0" 
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
icalendar = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls-native-roots"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
