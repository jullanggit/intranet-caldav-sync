[package]
name = "tam-scraper"
version = "0.1.0" 
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["cookies", "json"] }
scraper = "0.13"
tokio = { version = "1", features = ["full", "time"] }
serde_json = "1.0"
chrono = "0.4.45"
serde = {version = "1.0.228", features = ["derive"]}
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
